name: Publish

# When a push to main changes the version in package.json, creates the GitHub
# release (tag vX.Y.Z) and publishes that version to npm and JSR. Pushes that
# leave the version alone, or whose tag already exists, do nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and release
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check jsr.json version matches package.json
        run: test "$(node -p 'require("./jsr.json").version')" = "$(node -p 'require("./package.json").version')"
      - name: Create the release for a new version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag already exists; nothing to release."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Staged publishing needs npm 11.15.0 or later.
      - run: npm install -g npm@11
      - name: Skip versions already on npm
        id: published
        run: |
          if npm view "$(node -p 'require("./package.json").name')@${TAG#v}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} is already on npm; nothing to publish."
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm ci
      - if: steps.published.outputs.already != 'true'
        run: npm run typecheck
      - if: steps.published.outputs.already != 'true'
        run: npm test
      # Authenticates with npm trusted publishing (OIDC); no token is stored.
      # The trusted publisher only allows staging, so the version goes live
      # once a maintainer approves it on npm (npm stage approve).
      - if: steps.published.outputs.already != 'true'
        run: npm stage publish --access public --provenance

  jsr:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # JSR OIDC publishing
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Skip versions already on JSR
        id: published
        run: |
          if curl -fsS "https://jsr.io/$(node -p 'require("./jsr.json").name')/meta.json" | jq -e --arg v "${TAG#v}" '.versions[$v]' >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${TAG} is already on JSR; nothing to publish."
          fi
      # Authenticates with the GitHub Actions OIDC token; no secret is stored.
      - if: steps.published.outputs.already != 'true'
        run: npx -y jsr@0.14.3 publish
