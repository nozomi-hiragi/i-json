name: Publish

# Publishes to npm when a GitHub release is published. The release tag must
# match the version in package.json (e.g. v0.1.0).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Skip versions already on npm
        id: published
        run: |
          if npm view "$(node -p 'require("./package.json").name')@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_REF_NAME} is already on npm; nothing to publish."
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm ci
      - if: steps.published.outputs.already != 'true'
        run: npm run typecheck
      - if: steps.published.outputs.already != 'true'
        run: npm test
      # Authenticates with npm trusted publishing (OIDC); no token is stored.
      - if: steps.published.outputs.already != 'true'
        run: npm publish --access public --provenance
